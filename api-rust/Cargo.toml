[package]
name = "eta-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
strip = true
